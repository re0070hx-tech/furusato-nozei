name: Satofull Scraper (Self-hosted)

on:
  schedule:
    # 毎日 22:00 JST = 13:00 UTC (自宅PCが起動している時間帯)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  scrape-satofull:
    name: "Scrape: satofull"
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run satofull scraper
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VC_SATOFULL_SID:           ${{ secrets.VC_SATOFULL_SID }}
          VC_SATOFULL_PID:           ${{ secrets.VC_SATOFULL_PID }}
        working-directory: backend
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python -X utf8 -m scrapers.satofull
