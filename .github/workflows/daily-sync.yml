name: Daily Scraper Sync

on:
  schedule:
    # 毎日 AM3:00 JST = 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      site_id:
        description: "特定サイトのみ実行 (例: rakuten)。空白で全アクティブサイト実行"
        required: false
        default: ""

jobs:
  # ─────────────────────────────────────────────────────────
  # ① 全サイトを matrix で並列実行
  # ─────────────────────────────────────────────────────────
  scrape:
    name: "Scrape: ${{ matrix.site.id }}"
    runs-on: ${{ matrix.site.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    continue-on-error: true

    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        site:
          # ── アクティブ (スクレイパー実装済み) ──────────────────
          - { id: rakuten,           module: scrapers.rakuten_api,     type: api,        active: true  }
          - { id: furunavi,          module: scrapers.furunavi,        type: playwright, active: true  }
          - { id: satofull,          module: scrapers.satofull,        type: playwright, active: true,  runner: self-hosted }
          - { id: amazon,            module: scrapers.amazon,          type: api,        active: false }
          - { id: furusato_choice,   module: scrapers.furusato_choice, type: playwright, active: true  }
          - { id: pokemaru,          module: scrapers.pokemaru,        type: playwright, active: true  }
          - { id: whiskey_furusato,  module: scrapers.whiskey_furusato,type: playwright, active: true  }
          - { id: dshopping,         module: scrapers.dshopping,       type: playwright, active: true  }
          - { id: honpo,             module: scrapers.honpo,           type: playwright, active: true  }
          - { id: ana,               module: scrapers.ana,             type: playwright, active: true  }
          - { id: jal,               module: scrapers.jal,             type: playwright, active: true  }
          - { id: saison,            module: scrapers.saison,          type: playwright, active: true  }
          - { id: jre_mall,          module: scrapers.jre_mall,        type: playwright, active: true  }
          - { id: qoo10,             module: scrapers.qoo10,           type: playwright, active: true  }
          - { id: montbell,          module: scrapers.montbell,        type: playwright, active: true  }
          - { id: furu_lab,          module: scrapers.furu_lab,        type: playwright, active: true  }
          - { id: mitsukoshi,        module: scrapers.mitsukoshi,      type: playwright, active: true  }
          - { id: furopo,            module: scrapers.furopo,          type: playwright, active: true  }
          - { id: furu_premium,      module: scrapers.furu_premium,    type: playwright, active: true  }
          - { id: aupay,             module: scrapers.aupay,           type: playwright, active: true  }
          - { id: tabechoku,         module: scrapers.tabechoku,       type: playwright, active: true  }
          - { id: nippon,            module: scrapers.nippon,          type: playwright, active: true  }
          - { id: maifuru,           module: scrapers.aeon,            type: playwright, active: true  }
          - { id: palette,           module: scrapers.palette,         type: playwright, active: true  }
          - { id: yell,              module: scrapers.yell,            type: playwright, active: true  }
          # ── 閉鎖・アクセス不可 (active: false) ────────────────
          - { id: mynavi,            module: scrapers.mynavi,          type: playwright, active: false }
          - { id: gurune,            module: scrapers.gurune,          type: playwright, active: false }
          - { id: gurusuguri,        module: scrapers.gurusuguri,      type: playwright, active: false }
          - { id: hyakusen,          module: scrapers.hyakusen,        type: playwright, active: false }
          - { id: tokyu,             module: scrapers.tokyu,           type: playwright, active: false }

    steps:
      - name: Check if this site should run
        id: gate
        run: |
          if [ "${{ matrix.site.active }}" = "true" ] && \
             { [ -z "${{ github.event.inputs.site_id }}" ] || \
               [ "${{ github.event.inputs.site_id }}" = "${{ matrix.site.id }}" ]; }; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.site.id }} をスキップ (active=${{ matrix.site.active }})"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt

      - name: Install Playwright
        if: steps.gate.outputs.run == 'true' && matrix.site.type == 'playwright'
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Rakuten
          RAKUTEN_APP_ID:            ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:        ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID:      ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_APP_URL:           ${{ secrets.RAKUTEN_APP_URL }}
          # Amazon PA-API 5.0
          AMAZON_ACCESS_KEY:         ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:         ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG:        ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_ASSOCIATES_TAG:     ${{ secrets.AMAZON_ASSOCIATES_TAG }}
          # A8.net
          A8_FURUNAVI_ID:            ${{ secrets.A8_FURUNAVI_ID }}
          A8_CHOICE_ID:              ${{ secrets.A8_CHOICE_ID }}
          A8_MYNAVI_ID:              ${{ secrets.A8_MYNAVI_ID }}
          A8_FURULAB_ID:             ${{ secrets.A8_FURULAB_ID }}
          A8_HONPO_ID:               ${{ secrets.A8_HONPO_ID }}
          A8_PALETTE_ID:             ${{ secrets.A8_PALETTE_ID }}
          A8_HYAKUSEN_ID:            ${{ secrets.A8_HYAKUSEN_ID }}
          A8_QOO10_ID:               ${{ secrets.A8_QOO10_ID }}
          A8_YELL_ID:                ${{ secrets.A8_YELL_ID }}
          # ValueCommerce
          VC_SATOFULL_SID:           ${{ secrets.VC_SATOFULL_SID }}
          VC_SATOFULL_PID:           ${{ secrets.VC_SATOFULL_PID }}
          VC_FURUPREMIUM_SID:        ${{ secrets.VC_FURUPREMIUM_SID }}
          VC_FURUPREMIUM_PID:        ${{ secrets.VC_FURUPREMIUM_PID }}
          VC_SAISON_SID:             ${{ secrets.VC_SAISON_SID }}
          VC_SAISON_PID:             ${{ secrets.VC_SAISON_PID }}
          # Direct affiliates
          ANA_AFF_ID:                ${{ secrets.ANA_AFF_ID }}
          JAL_AFF_ID:                ${{ secrets.JAL_AFF_ID }}
          JRE_AFF_ID:                ${{ secrets.JRE_AFF_ID }}
          TOKYU_AFF_ID:              ${{ secrets.TOKYU_AFF_ID }}
          MITSUKOSHI_AFF_ID:         ${{ secrets.MITSUKOSHI_AFF_ID }}
          AUPAY_AFF_ID:              ${{ secrets.AUPAY_AFF_ID }}
          MONTBELL_AFF_ID:           ${{ secrets.MONTBELL_AFF_ID }}
        working-directory: backend
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python -X utf8 -m ${{ matrix.site.module }}

  # ─────────────────────────────────────────────────────────
  # ② 全スクレイパー完了後に還元率を一括計算
  # ─────────────────────────────────────────────────────────
  calc_asset_rate:
    name: "Calculate asset_rate"
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Calculate asset_rate for new rows
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: backend
        run: python -X utf8 -m scripts.calc_asset_rate

  # ─────────────────────────────────────────────────────────
  # ③ 失敗時通知
  # ─────────────────────────────────────────────────────────
  notify_on_failure:
    name: "Notify on failure"
    runs-on: ubuntu-latest
    needs: [scrape, calc_asset_rate]
    if: failure()
    steps:
      - name: Report failed jobs
        run: |
          echo "::error::スクレイパーまたは還元率計算に失敗しました。"
          echo "scrape result   : ${{ needs.scrape.result }}"
          echo "calc_rate result: ${{ needs.calc_asset_rate.result }}"
